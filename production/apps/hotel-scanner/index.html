<!doctype html>
<html lang="en">
  <head>
    <script>(function(){try{
var ids=['light','dark','light-crimson','dark-crimson','light-ember','dark-ember','light-amber','dark-amber','light-gold','dark-gold','light-lime','dark-lime','light-emerald','dark-emerald','light-forest','dark-forest','light-teal','dark-teal','light-rose','dark-rose'];
var t=localStorage.getItem('lovelaundry-theme');
if(ids.indexOf(t)<0){
  var legacy=localStorage.getItem('theme-preset');
  if(legacy==='dark'||legacy==='nightblue'||legacy==='contrast-dark'){t='dark';}
  else if(legacy==='light'||legacy==='contrast'||legacy==='ocean'||legacy==='forest'||legacy==='sepia'||legacy==='slate'){t='light';}
  else{t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}
}
var mode=t.indexOf('dark')===0?'dark':'light';
var r=document.documentElement;
r.setAttribute('data-theme',t);r.style.colorScheme=mode;r.classList.toggle('dark',mode==='dark');
}catch(e){document.documentElement.setAttribute('data-theme','light')}})();</script>
    
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Hotel Scanner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
