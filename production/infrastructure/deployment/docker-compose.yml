x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: central_system
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          memory: 1024M
    logging: *default-logging

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      AUTH_REQUIRED: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY is required}
      MONGODB_CENTRAL_URI: ${MONGODB_CENTRAL_URI:?MONGODB_CENTRAL_URI is required}
      MONGODB_CENTRAL_DB: central_system
      MONGODB_LAUNDRY_URI: ${MONGODB_LAUNDRY_URI:?MONGODB_LAUNDRY_URI is required}
      MONGODB_LAUNDRY_DB: laundry_internal
      MONGODB_LINEN_URI: ${MONGODB_LINEN_URI:?MONGODB_LINEN_URI is required}
      MONGODB_LINEN_DB: linen_tracking
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:5180}
      EVENT_WORKER_ENABLED: "true"
      EVENT_WORKER_INTERVAL_SECONDS: "5"
      RECONCILIATION_INTERVAL_SECONDS: "300"
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          memory: 384M
    logging: *default-logging

  platform-admin:
    build:
      context: ../../apps/platform-admin
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
    logging: *default-logging

  mongo-backup:
    image: mongo:7.0
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_BACKUP_URI: ${MONGO_BACKUP_URI:-mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/?authSource=admin}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - backup_data:/backup
    entrypoint: ["/bin/sh", "-c"]
    command: |
      while true; do
        destination="/backup/$$(date +%Y%m%d-%H%M%S)"
        if mongodump --uri "$$MONGO_BACKUP_URI" --out "$$destination"; then
          find /backup -mindepth 1 -maxdepth 1 -type d -mtime +"$$BACKUP_RETENTION_DAYS" -exec rm -rf {} +
        fi
        sleep 86400
      done
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 128M
    logging: *default-logging

  mongo-restore:
    image: mongo:7.0
    profiles: ["restore"]
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_RESTORE_URI: ${MONGO_RESTORE_URI:-}
      RESTORE_SOURCE: ${RESTORE_SOURCE:-}
    volumes:
      - backup_data:/backup:ro
    entrypoint: ["/bin/sh", "-c"]
    command: |
      if [ -z "$$MONGO_RESTORE_URI" ] || [ -z "$$RESTORE_SOURCE" ]; then
        echo "MONGO_RESTORE_URI and RESTORE_SOURCE are required for restore"
        exit 1
      fi
      mongorestore --uri "$$MONGO_RESTORE_URI" --drop "$$RESTORE_SOURCE"
    logging: *default-logging

  reverse-proxy:
    image: nginx:1.27
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../../infrastructure/reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - backend_api:/var/cache/nginx
    depends_on:
      backend:
        condition: service_healthy
      platform-admin:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
    logging: *default-logging

volumes:
  mongo_data:
  backup_data:
  backend_api:
