services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: central_system
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      MASTER_KEY: ${MASTER_KEY}
      MONGODB_CENTRAL_URI: ${MONGODB_CENTRAL_URI}
      MONGODB_CENTRAL_DB: central_system
      MONGODB_LAUNDRY_URI: ${MONGODB_LAUNDRY_URI}
      MONGODB_LAUNDRY_DB: laundry_internal
      MONGODB_LINEN_URI: ${MONGODB_LINEN_URI}
      MONGODB_LINEN_DB: linen_tracking
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  reverse-proxy:
    image: nginx:1.27
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_api:/var/cache/nginx
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
  backend_api:
