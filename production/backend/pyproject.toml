[project]
name = "production-backend"
version = "1.0.0"
description = "LoveLaundry production rebuild backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "cryptography>=42.0",
    "motor>=3.4",
    "pymongo>=4.10.0",
    "python-dotenv>=1.2.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
    "argon2-cffi>=23.1.0",
    "qrcode>=8.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "mongomock-motor>=0.0.34",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
