server {
  listen 8820;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-yjSY7EctlJF/AFGTPEGQHa9+f5jgmpqqGL4y/1rjTb4='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: wss:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;


  location /api/ {
    proxy_pass http://system-info-backend:8810;
  }
  location /health {
    proxy_pass http://system-info-backend:8810;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
