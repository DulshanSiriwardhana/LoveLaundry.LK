server {
  listen 8101;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /auth/ {
    proxy_pass http://backend:8100;
  }
  location /users {
    proxy_pass http://backend:8100;
  }
  location /api/ {
    proxy_pass http://backend:8100;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
